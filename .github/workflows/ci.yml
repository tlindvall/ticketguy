name: ci
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ticketguy_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      APP_MODE: fixture
      # Never point CI at a real database: the only URL is the ephemeral service container.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ticketguy_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm registry:build && git diff --exit-code research/ticket-guy-us-source-registry.json
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm vitest run --project pg
      - run: pnpm audit --prod --audit-level=high || true
      - run: pnpm build
      - name: no secrets or server modules in browser bundles
        run: |
          ! grep -rEl "postgres://|whsec_|BETTER_AUTH_SECRET=|RESEND_API_KEY=|drizzle-orm/postgres-js|@electric-sql/pglite" .next/static || (echo "server material found in client bundle" && exit 1)
