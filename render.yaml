# Render blueprint — no secrets embedded. Secrets are entered in the Render dashboard (sync: false).
# One paid web service + one dedicated PostgreSQL database in the same US region. Migrations run once per
# deploy in preDeployCommand with an advisory lock (never from web replicas, never drizzle-kit push).
services:
  - type: web
    name: ticketguy
    runtime: node
    plan: starter
    region: ohio
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    # Seed is idempotent (onConflictDoNothing) and scripts/seed.ts skips the fixture world unless
    # APP_MODE=fixture, so this only ever loads the source registry and the default kill switches.
    # Without it a fresh database has the schema and no reference data: no sources, no kill switches.
    preDeployCommand: pnpm db:migrate && pnpm db:seed
    startCommand: pnpm start
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: APP_MODE
        value: live
      # APP_URL is intentionally unset: RENDER_EXTERNAL_URL supplies the public https URL, which
      # drives Better Auth trusted origins, admin CSRF origin checks and signed email links.
      # Set it explicitly only once a custom domain is attached.
      - key: EXTRACTION_PROVIDER
        value: openai
      # Database-backed media must stay well inside the database plan's storage. Raise only with the plan.
      - key: MEDIA_MAX_TOTAL_BYTES
        value: "268435456"
      # Outbound email is ON. What keeps it safe is EMAIL_TEST_RECIPIENT_ALLOWLIST below: the send gate
      # refuses any recipient not on that list, so only named addresses can be mailed. Empty that list only
      # once the pipeline has run end to end and the sending domain has a delivery history.
      # This value is set here rather than in the dashboard because the blueprint overwrites the dashboard
      # on every deploy — a value set only there silently reverts to this one.
      - key: EMAIL_SEND_ENABLED
        value: "true"
      # Comma-separated recipients the service is allowed to email, entered in the dashboard and never in
      # this file, because they are real addresses. An empty value means NO restriction, so it has no
      # default here: forgetting to set it must not quietly open sending to everyone who writes in.
      - key: EMAIL_TEST_RECIPIENT_ALLOWLIST
        sync: false
      - key: MARKETING_SEND_ENABLED
        value: "false"
      - key: WATCH_SEND_ENABLED
        value: "false"
      - key: HUMAN_REVIEW_REQUIRED
        value: "true"
      - key: PG_POOL_MAX
        value: "5"
      - key: MEDIA_PROVIDER
        value: db
      - key: DATABASE_URL
        fromDatabase:
          name: ticketguy-db
          property: connectionString
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: PREFERENCE_TOKEN_SIGNING_KEY
        sync: false
      - key: INTERNAL_CRON_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # No OpenAI rates ship with the code; without this every call bills at the conservative default.
      - key: MODEL_PRICES_USD_PER_MTOKEN
        sync: false
      - key: INNGEST_EVENT_KEY
        sync: false
      - key: INNGEST_SIGNING_KEY
        sync: false
      - key: STAFF_EMAIL_ALLOWLIST
        sync: false
      - key: BUSINESS_POSTAL_ADDRESS
        sync: false
      - key: SENTRY_DSN
        sync: false
databases:
  - name: ticketguy-db
    plan: basic-256mb
    region: ohio
    postgresMajorVersion: "18"
    ipAllowList: []
